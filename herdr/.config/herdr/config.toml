onboarding = false

[theme]
auto_switch = true
light_name = "one-light"
dark_name = "dracula"

[keys]
copy_mode = "prefix+c"
new_tab = "prefix+n"
previous_tab = "prefix+["
next_tab = "prefix+]"
previous_workspace = "prefix+{"
next_workspace = "prefix+}"
previous_agent = "prefix+("
next_agent = "prefix+)"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[experimental]
kitty_graphics = true
